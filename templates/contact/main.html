
{% load static %}

<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-50 via-white to-purple-50 p-4">

    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl shadow-indigo-100/50 border border-gray-100 p-8 sm:p-10">

        <form method="POST">
            {% csrf_token %}

            <!-- Heading -->
            <div class="text-center mb-9">
                <div class="w-16 h-16 bg-indigo-100 rounded-2xl flex items-center justify-center mx-auto mb-5">
                    <span class="text-3xl">👋</span>
                </div>

                <h1 class="text-3xl font-bold text-slate-900">
                    Welcome Back
                </h1>

                <p class="text-sm text-slate-500 mt-3">
                    Please sign in to your account
                </p>
            </div>

            <!-- Google Button -->
            <button
                type="button"
                class="w-full h-12 flex items-center justify-center gap-3 border border-slate-200 rounded-xl hover:bg-slate-50 hover:border-slate-300 transition duration-200"
            >
                <img
                    src="https://raw.githubusercontent.com/prebuiltui/prebuiltui/main/assets/login/googleLogo.svg"
                    alt="Google"
                    class="w-10 h-10"
                >

                <span class="text-sm font-medium text-slate-700">
                    Continue with Google
                </span>
            </button>

            <!-- Divider -->
            <div class="flex items-center gap-4 my-7">
                <div class="flex-1 h-px bg-slate-200"></div>
                <span class="text-xs text-slate-400 whitespace-nowrap">
                    OR CONTINUE WITH EMAIL
                </span>
                <div class="flex-1 h-px bg-slate-200"></div>
            </div>

            <!-- Email -->
            <div class="mb-5">
                <label class="block text-sm font-semibold text-slate-700 mb-2">
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                    class="w-full h-12 px-4 rounded-xl bg-slate-50 border border-slate-200 outline-none text-sm transition focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10"
                >
            </div>

            <!-- Password -->
            <div class="mb-4">
                <div class="flex justify-between mb-2">
                    <label class="text-sm font-semibold text-slate-700">
                        Password
                    </label>

                    <a href="#" class="text-sm text-indigo-600 hover:underline">
                        Forgot password?
                    </a>
                </div>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    class="w-full h-12 px-4 rounded-xl bg-slate-50 border border-slate-200 outline-none text-sm transition focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10"
                >
            </div>

            <!-- Remember -->
            <div class="flex items-center gap-2 mt-5">
                <input
                    type="checkbox"
                    name="remember"
                    id="remember"
                    class="w-4 h-4 accent-indigo-600 cursor-pointer"
                >

                <label for="remember" class="text-sm text-slate-600 cursor-pointer">
                    Remember me
                </label>
            </div>

            <!-- Login -->
            <button
                type="submit"
                class="w-full h-12 mt-7 bg-indigo-600 text-white font-semibold rounded-xl hover:bg-indigo-700 active:scale-[0.98] transition duration-200 shadow-lg shadow-indigo-600/20"
            >
                Sign in
            </button>

            <!-- Sign Up -->
            <p class="text-center text-sm text-slate-500 mt-7">
                Don't have an account?

                <a href="#" class="text-indigo-600 font-semibold hover:underline">
                    Sign up
                </a>
            </p>

        </form>

    </div>
</div>
