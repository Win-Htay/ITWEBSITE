{% load static %}

<section class="relative min-h-[420px] md:min-h-[633px] overflow-hidden bg-[#101b34] flex items-center justify-center px-5">

  <!-- Background Glow -->
  <div class="absolute -top-32 -left-32 w-96 h-96 bg-blue-500/10 rounded-full blur-[100px]"></div>
  <div class="absolute top-1/3 -right-32 w-96 h-96 bg-indigo-500/10 rounded-full blur-[100px]"></div>
  <div class="absolute -top-10 right-10 w-40 h-20 bg-blue-300/20 rounded-full blur-3xl"></div>

  <!-- Hero Content -->
  <div class="relative z-10 w-full max-w-5xl mx-auto text-center">

    <!-- Badge -->
    <div class="inline-flex items-center gap-3 px-6 py-3 mb-8 rounded-full
                bg-slate-700/60 border border-slate-500/40 shadow-sm">

      <svg class="w-5 h-5 text-emerald-400 fill-current"
           viewBox="0 0 24 24">
        <path d="M12 5.5C9.5 3.8 5.5 3.5 2 5v14c3.5-1.5 7.5-1.2 10 0 2.5-1.2 6.5-1.5 10 0V5c-3.5-1.5-7.5-1.2-10 0z"/>
      </svg>

      <span class="text-sm md:text-base font-bold tracking-wider text-blue-200">
        ERROR DIGITAL LIBRARY
      </span>
    </div>

    <!-- Heading -->
    <h1 class="text-5xl sm:text-6xl md:text-8xl font-extrabold
               tracking-tight text-white leading-tight">
      Digital
      <span class="text-[#91c3ff]">Library</span>
    </h1>

    <!-- Description -->
    <p class="mt-7 max-w-5xl mx-auto text-lg sm:text-xl md:text-2xl
              leading-relaxed text-blue-100 font-normal">
      သန်းပေါင်းများစွာသော သင့်စိတ်ကူးများကို တစ်နေရာတည်းမှာ အဆင်ပြေစွာ လေ့လာနိုင်ပါသည်။
    </p>

  </div>
</section>




<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap" rel="stylesheet">


<section class="min-h-screen bg-[#f6f9fc] px-5 md:px-7 py-16">

  <div class="max-w-[1900px] mx-auto">

    <!-- Section Header -->
    <div class="flex items-center justify-between border-b border-slate-200 pb-7 mb-14">

      <div class="flex items-center gap-5">
        <div class="w-[10px] h-12 rounded-full bg-blue-600"></div>

        <h2 class="text-2xl md:text-4xl font-bold text-[#15233d]">
          အခမဲ့ နည်းပညာစာအုပ်များ
        </h2>
      </div>

      <span class="text-xs md:text-sm font-bold tracking-widest text-slate-400">
        4 BOOKS
      </span>

    </div>

    <!-- Book Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-8 lg:gap-12">

      <!-- Card 1 -->
        {% for course in courses %}

      <div class="group bg-white rounded-[45px] overflow-hidden
                  border border-slate-100 shadow-sm
                  hover:shadow-2xl hover:-translate-y-2
                  transition-all duration-500">

        <!-- Image -->
        <div class="relative h-[330px] md:h-[436px] overflow-hidden bg-white">

          <img
            src="{{course.image.url}}"
            alt="Django"
            class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
          />

          <!-- Hover Overlay -->
          <div class="absolute inset-0 bg-gradient-to-t
                      from-black/60 via-transparent to-transparent
                      opacity-0 group-hover:opacity-100
                      transition-all duration-500">
          </div>

          <div class="absolute bottom-8 left-10 flex items-center gap-3
                      text-white font-bold opacity-0 translate-y-5
                      group-hover:opacity-100 group-hover:translate-y-0
                      transition-all duration-500">

            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 5c-5 0-9.3 3.1-11 7 1.7 3.9 6 7 11 7s9.3-3.1 11-7c-1.7-3.9-6-7-11-7zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/>
            </svg>

            <span>အသေးစိတ်ကြည့်ရန်</span>
          </div>

        </div>

        <!-- Content -->
        <div class="p-8 md:p-10">

          <h3 class="text-2xl font-extrabold text-blue-600 mb-4">
        {{course.title}}
          </h3>

          <p class="text-base leading-relaxed text-slate-500 line-clamp-2">
           {{course.name}}
          </p>

          <div class="flex items-center justify-between mt-8">

            <span class="px-4 py-2 rounded-full bg-blue-50
                         text-blue-600 text-xs font-extrabold tracking-wider">
              22 CHAPTERS
            </span>

            <button class="w-[50px] h-[50px] rounded-full
                           bg-[#10182e] text-white
                           flex items-center justify-center
                           hover:bg-blue-600 hover:scale-110
                           transition-all duration-300">

              <svg class="w-6 h-6" fill="none" stroke="currentColor"
                   stroke-width="3" viewBox="0 0 24 24">
                <path d="M5 12h14m-7-7 7 7-7 7"/>
              </svg>

            </button>

          </div>
        </div>
      </div>
      {% endfor %}
  
  

    </div>
  </div>
</section>
